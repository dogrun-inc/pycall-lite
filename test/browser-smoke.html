<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pycall-lite Browser Smoke Test</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --ok: #0f766e;
        --ng: #b91c1c;
        --accent: #1d4ed8;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", "Noto Sans", sans-serif;
        background: radial-gradient(circle at top right, #dbeafe, var(--bg));
        color: var(--text);
      }

      .wrap {
        max-width: 920px;
        margin: 40px auto;
        padding: 0 20px;
      }

      .card {
        background: var(--card);
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        box-shadow: 0 12px 28px rgba(17, 24, 39, 0.08);
        padding: 22px;
      }

      h1 {
        margin-top: 0;
        font-size: 1.4rem;
      }

      p {
        color: var(--muted);
      }

      button {
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: white;
        padding: 10px 14px;
        font-size: 14px;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.55;
        cursor: default;
      }

      pre {
        margin-top: 16px;
        padding: 12px;
        border-radius: 10px;
        background: #0f172a;
        color: #e2e8f0;
        overflow: auto;
        min-height: 130px;
      }

      .ok {
        color: var(--ok);
        font-weight: 600;
      }

      .ng {
        color: var(--ng);
        font-weight: 600;
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "@bjorn3/browser_wasi_shim": "../node_modules/@bjorn3/browser_wasi_shim/dist/index.js"
        }
      }
    </script>
  </head>
  <body>
    <main class="wrap">
      <section class="card">
        <h1>pycall-lite Browser Smoke Test</h1>
        <p>
          This page initializes Pyodide + Ruby.wasm using the built package and
          checks core APIs, import macros, type conversion, and NumPy.
          Run <code>npm run build</code> and serve the repository over HTTP before opening this page.
        </p>
        <button id="run">Run Smoke Test</button>
        <p id="summary"></p>
        <pre id="log"></pre>
      </section>
    </main>

    <script type="module">
      import { DefaultRubyVM } from "../node_modules/@ruby/wasm-wasi/dist/esm/browser.js";
      import { loadPyodide } from "../node_modules/pyodide/pyodide.mjs";
      import { setupPyCall } from "../dist/index.js";

      const $run = document.getElementById("run");
      const $summary = document.getElementById("summary");
      const $log = document.getElementById("log");

      const log = (line) => {
        $log.textContent += `${line}\n`;
      };

      async function initRubyVM() {
        const wasmUrl = new URL(
          "../node_modules/@ruby/3.3-wasm-wasi/dist/ruby+stdlib.wasm",
          import.meta.url
        );
        const wasmBinary = await fetch(wasmUrl).then((r) => r.arrayBuffer());
        const rubyModule = await WebAssembly.compile(wasmBinary);
        return DefaultRubyVM(rubyModule, { consolePrint: false });
      }

      async function runSmokeTest() {
        $summary.textContent = "";
        $summary.className = "";
        $log.textContent = "";
        $run.disabled = true;

        try {
          delete globalThis.smoke_results;
          log("[1/6] Loading Pyodide...");
          const pyodide = await loadPyodide({
            indexURL: new URL("../node_modules/pyodide/", import.meta.url).href,
          });

          log("[2/6] Loading NumPy...");
          await pyodide.loadPackage("numpy");

          log("[3/6] Loading Ruby.wasm...");
          const { vm } = await initRubyVM();

          setupPyCall(vm, pyodide);

          log("[4/6] Preparing Python fixtures...");
          await pyodide.runPythonAsync(`
class Box:
    def __init__(self):
        self.value = 42

box = Box()
data = {"a": 1}
`);

          log("[5/6] Executing Ruby checks...");
          vm.eval(`
            require "pycall"
            require "pycall/import"

            math = PyCall.import_module("math")
            sin_ok = (math.sin(math.pi / 2) == 1)

            main = PyCall.import_module("__main__")
            b = main.box
            b.value = 100
            attr_ok = (b.value == 100)

            d = main.data
            d["b"] = 2
            index_ok = (d["b"] == 2)

            module MacroSmoke
              include PyCall::Import
              pyimport :math
              pyimport :json, as: :py_json
              pyfrom :math, import: :cos
            end

            pyimport_ok = MacroSmoke.math.sqrt(9) == 3
            pyimport_alias_ok = MacroSmoke.py_json.respond_to?(:dumps)
            pyfrom_ok = MacroSmoke.cos(0) == 1

            # [Step 5] Type conversion tests
            # Test Python-to-Ruby conversions (PyProxy objects accessed via [])
            json_mod = PyCall.import_module(:json)
            
            # Test 1: Parse Python JSON and access nested structure
            py_list = json_mod.loads("[1, 2, 3]")
            array_access_ok = py_list[0] == 1 && py_list[1] == 2

            # Test 2: Parse Python dict and access elements
            py_dict = json_mod.loads('{"name": "test", "value": 42}')
            dict_access_ok = py_dict["name"] == "test" && py_dict["value"] == 42

            # Test 3: Boolean conversion from Python
            json_true_str = json_mod.dumps(true)
            py_bool = json_mod.loads("true")
            bool_conversion_ok = py_bool == true

            # Test 4: Null to nil conversion
            py_null = json_mod.loads("null")
            nil_conversion_ok = py_null == nil

            # Test 5: Ruby primitives remain accessible
            math_mod = PyCall.import_module(:math)
            pi_val = math_mod.pi
            primitive_ok = pi_val.is_a?(Float) && pi_val > 3.1 && pi_val < 3.2

            # Test 6: Proc wrapping (basic structure check)
            callback = proc { |x| x * 2 }
            proc_wrap_ok = callback.is_a?(Proc)

            require "numpy"
            numpy_array = Numpy.asarray([[1, 2], [3, 4]], dtype: :float64)
            numpy_index_ok = numpy_array.is_a?(Numpy::NDArray) &&
              numpy_array[1, 0].is_a?(Float) && numpy_array[1, 0] == 3.0
            numpy_values = numpy_array.to_a
            numpy_to_a_ok = numpy_values == [[1.0, 2.0], [3.0, 4.0]] &&
              numpy_values.flatten.all? { |value| value.is_a?(Float) }
            numpy_mean_ok = Numpy.mean(numpy_array) == 2.5 &&
              Numpy.mean(numpy_array, axis: 0).to_a == [2.0, 3.0]
            numpy_scalar = Numpy.asscalar(Numpy.asarray([1], dtype: :float32))
            numpy_scalar_ok = numpy_scalar.is_a?(Float) && numpy_scalar == 1.0 &&
              Numpy.asarray(1).to_a == 1
            numpy_error_ok = false
            begin
              numpy_array[9, 0]
            rescue PyCall::PythonError => error
              numpy_error_ok = error.message.include?("IndexError")
            end

            JS.global[:smoke_results] = {
              sin_ok: sin_ok,
              attr_ok: attr_ok,
              index_ok: index_ok,
              pyimport_ok: pyimport_ok,
              pyimport_alias_ok: pyimport_alias_ok,
              pyfrom_ok: pyfrom_ok,
              array_access_ok: array_access_ok,
              dict_access_ok: dict_access_ok,
              bool_conversion_ok: bool_conversion_ok,
              nil_conversion_ok: nil_conversion_ok,
              primitive_ok: primitive_ok,
              proc_wrap_ok: proc_wrap_ok,
              numpy_index_ok: numpy_index_ok,
              numpy_to_a_ok: numpy_to_a_ok,
              numpy_mean_ok: numpy_mean_ok,
              numpy_scalar_ok: numpy_scalar_ok,
              numpy_error_ok: numpy_error_ok
            }
          `);

          const r = globalThis.smoke_results;
          log("[6/6] Results:");
          log(`Core API: sin=${r?.sin_ok}, attr=${r?.attr_ok}, index=${r?.index_ok}, pyimport=${r?.pyimport_ok}, alias=${r?.pyimport_alias_ok}, pyfrom=${r?.pyfrom_ok}`);
          log(`Type conversion: array_access=${r?.array_access_ok}, dict_access=${r?.dict_access_ok}, bool=${r?.bool_conversion_ok}, nil=${r?.nil_conversion_ok}, primitive=${r?.primitive_ok}, proc=${r?.proc_wrap_ok}`);
          log(`NumPy: indexing=${r?.numpy_index_ok}, to_a=${r?.numpy_to_a_ok}, mean=${r?.numpy_mean_ok}, scalars=${r?.numpy_scalar_ok}, errors=${r?.numpy_error_ok}`);

          const passed =
            r?.sin_ok &&
            r?.attr_ok &&
            r?.index_ok &&
            r?.pyimport_ok &&
            r?.pyimport_alias_ok &&
            r?.pyfrom_ok &&
            r?.array_access_ok &&
            r?.dict_access_ok &&
            r?.bool_conversion_ok &&
            r?.nil_conversion_ok &&
            r?.primitive_ok &&
            r?.proc_wrap_ok &&
            r?.numpy_index_ok &&
            r?.numpy_to_a_ok &&
            r?.numpy_mean_ok &&
            r?.numpy_scalar_ok &&
            r?.numpy_error_ok;
          if (!passed) {
            throw new Error("One or more smoke checks failed.");
          }

          $summary.textContent = "PASS: Core APIs, type conversion, and NumPy checks completed successfully.";
          $summary.className = "ok";
        } catch (err) {
          log(`ERROR: ${err?.stack || err}`);
          $summary.textContent = "FAIL: Browser smoke test failed. See logs above.";
          $summary.className = "ng";
        } finally {
          $run.disabled = false;
        }
      }

      $run.addEventListener("click", runSmokeTest);
    </script>
  </body>
</html>
